{{ if .IsHome }}
{{ partial "research-network.html" . }}
{{ $network := resources.Get "js/network-background.js" | minify | fingerprint }}
<script defer src="{{ $network.RelPermalink }}" integrity="{{ $network.Data.Integrity }}" crossorigin="anonymous"></script>
{{ end }}
<div id="copy-status" class="copy-status" role="status" aria-live="polite" aria-atomic="true"
     data-name-success="{{ i18n "name_copied" }}" data-email-success="{{ i18n "email_copied" }}" data-citation-success="{{ i18n "citation_copied" }}" data-failure="{{ i18n "copy_failed" }}">
  <svg class="copy-status-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="10" cy="10" r="8" opacity="0.4" />
    <path class="copy-status-check" pathLength="1" d="m6 10 2.5 2.5 5-5" />
    <path class="copy-status-cross" d="m7.5 7.5 5 5m0-5-5 5" />
  </svg>
  <span class="copy-status-label"></span>
</div>
{{ $interactions := resources.Get "js/site-interactions.js" | minify | fingerprint }}
<script defer src="{{ $interactions.RelPermalink }}" integrity="{{ $interactions.Data.Integrity }}" crossorigin="anonymous"></script>
