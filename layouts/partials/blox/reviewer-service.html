{{ $service := site.Data.review_service }}
{{ $journals := sort $service.journals "impact_factor" "desc" }}
<div class="flex flex-col items-center max-w-prose mx-auto">
  <div class="reviewer-service px-6 sm:px-0">
    <h3 class="mb-6 text-3xl font-bold text-gray-900 dark:text-white">{{ i18n "academic_service" }}</h3>
    <ul class="reviewer-list">
      {{ range where $journals "pinned" true }}<li>{{ .name }}</li>{{ end }}
      {{ range where $journals "pinned" "ne" true }}<li>{{ .name }}</li>{{ end }}
    </ul>
  </div>
</div>
